<style>

/* WYK — design system v2 (inspiré Winfum : en-tête verre, carrousels, fiche pro) */
:root{--bg:#f6f5f2;--surface:#fff;--s2:#efeeea;--ink:#101010;--t2:#4a4a44;--mut:rgba(16,16,16,.56);--line:rgba(16,16,16,.11);
--red:#e8192c;--red-d:#bf0f20;--red-s:rgba(232,25,44,.09);--gold:#f5c842;--glass:rgba(255,255,255,.66);--glass2:rgba(255,255,255,.92);--brd:rgba(255,255,255,.75);
--r:20px;--sh1:0 2px 10px rgba(0,0,0,.06);--sh2:0 14px 40px rgba(0,0,0,.12);--ease:cubic-bezier(.2,.7,.2,1);
--fd:'Bricolage Grotesque','Inter',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0d0d0c;--surface:#171716;--s2:#20201e;--ink:#f3f2ec;--t2:#b4b3aa;--mut:rgba(243,242,236,.58);--line:rgba(243,242,236,.13);--red-s:rgba(232,25,44,.16);--glass:rgba(24,24,22,.62);--glass2:rgba(24,24,22,.92);--brd:rgba(255,255,255,.09);--sh1:0 2px 10px rgba(0,0,0,.4);--sh2:0 14px 40px rgba(0,0,0,.55)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
h1,h2,h3,h4{font-family:var(--fd);letter-spacing:-.02em;line-height:1.05}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.tag{font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--red)}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid var(--brd)}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s var(--ease),transform .7s var(--ease)}.reveal.in{opacity:1;transform:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:40px;font-weight:600;font-size:14px;transition:.25s var(--ease)}
.btn-red{background:linear-gradient(120deg,var(--red),#ff4b5c);color:#fff;box-shadow:0 8px 22px rgba(232,25,44,.32)}.btn-red:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(232,25,44,.42)}
.btn-dark{background:var(--ink);color:var(--bg)}.btn-line{border:1.5px solid var(--line)}.btn-line:hover{border-color:var(--ink)}
.btn-wa{background:#25d366;color:#fff;box-shadow:0 8px 22px rgba(37,211,102,.3)}

/* ===== EBOOK : thème bibliothèque ===== */
:root{--lb:#efe6d3}:root[data-theme="dark"]{--lb:#120d09}
body{background:radial-gradient(120% 55% at 50% 0,rgba(184,138,45,.14),transparent 60%),var(--lb)}
.lb{--bg:#efe6d3;--surface:#fbf6ea;--s2:#e6dac1;--ink:#21160c;--t2:#5a4632;--mut:rgba(33,22,12,.6);--line:rgba(60,35,10,.17);--red:#8f1d2c;--red-s:rgba(143,29,44,.1);--brass:#b88a2d;--glass:rgba(255,250,238,.62);--glass2:rgba(255,250,238,.95);--brd:rgba(184,138,45,.38);--sh1:0 2px 10px rgba(60,35,10,.1);--sh2:0 18px 50px rgba(40,22,6,.28);--fd:'Fraunces',Georgia,serif;color:var(--ink)}
:root[data-theme="dark"] .lb{--bg:#120d09;--surface:#1d1610;--s2:#2a2017;--ink:#f3e9d6;--t2:#c9b99f;--mut:rgba(243,233,214,.6);--line:rgba(243,233,214,.14);--glass:rgba(34,26,18,.62);--glass2:rgba(30,23,16,.95);--brd:rgba(184,138,45,.34);--sh1:0 2px 10px rgba(0,0,0,.4);--sh2:0 18px 50px rgba(0,0,0,.55)}
.lb .btn-red{background:linear-gradient(120deg,#7d1626,#b8344a);box-shadow:0 8px 22px rgba(143,29,44,.35)}
.lb .btn-dark,.btn-dark.lb{background:var(--ink);color:var(--surface)}
.lb h1,.lb h2,.lb h3,.lb h4{font-family:var(--fd)}
main{padding-top:14px;padding-bottom:120px;min-height:100vh}
.i{width:1.1em;height:1.1em;vertical-align:-.15em}
/* slide : large, texte devant le livre */
.hsw{position:relative;max-width:1200px;margin:0 auto;padding:0 16px}
.hs{position:relative;overflow:hidden;border-radius:26px;box-shadow:var(--sh2)}
.hs-track{display:flex;transition:transform .7s var(--ease)}
.sl{flex:0 0 100%;aspect-ratio:2/1;display:grid;grid-template-columns:minmax(0,28%) 1fr;align-items:center;gap:6%;padding:40px 8%;background:radial-gradient(120% 120% at 15% 20%,var(--b1),var(--b2));color:var(--tx);position:relative;overflow:hidden}
.sl:before{content:"";position:absolute;left:-6%;top:6%;width:56%;aspect-ratio:1;background:radial-gradient(closest-side,rgba(255,235,190,.26),transparent);pointer-events:none}
.sl:after{content:"";position:absolute;inset:0;background:linear-gradient(180deg,rgba(255,255,255,.07),transparent 40%);pointer-events:none}
.sl .bk{--w:min(250px,100%)}
.st{position:relative;z-index:1;display:grid;gap:14px;justify-items:start}
.st h2,.st h3{font-size:clamp(24px,4vw,52px);line-height:1.04}
.st p{font-size:16px;opacity:.88;max-width:48ch;white-space:pre-line}
.st .bt{background:var(--tx);color:var(--b2);box-shadow:0 10px 26px rgba(0,0,0,.3)}
.st .tg{padding:6px 14px;border-radius:30px;background:rgba(255,255,255,.16);backdrop-filter:blur(12px);-webkit-backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,.3);font-size:12.5px;font-weight:600}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:44px;height:44px;border-radius:50%;display:grid;place-items:center;z-index:3;background:rgba(255,255,255,.2);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid rgba(255,255,255,.35);color:#fff}
.arr.l{left:14px}.arr.r{right:14px}
.dots{display:flex;gap:7px;justify-content:center;margin-top:14px}.dots i{width:8px;height:8px;border-radius:8px;background:var(--line);transition:.3s;cursor:pointer}.dots i.on{width:26px;background:var(--brass)}
/* gabarit livre : vue de face, format variable */
.bk{--w:230px;--k:1;--r:.667;--th:6px;--c:#111;--sc:#fff;width:calc(var(--w)*var(--k));aspect-ratio:var(--r);position:relative;justify-self:center;container-type:inline-size;flex:none;transition:transform .32s cubic-bezier(.2,.7,.2,1)}
.bk .f{position:absolute;inset:0;border-radius:3px 8px 8px 3px;background:var(--c);overflow:hidden;box-shadow:calc(var(--th)*.25) 0 0 #f6f4ee,calc(var(--th)*.5) 0 0 #d6d2c8,calc(var(--th)*.75) 0 0 #f2f0e9,var(--th) 0 0 #bfbbb0,0 calc(var(--th)*.25) 0 #ece9e2,0 calc(var(--th)*.5) 0 #cbc7bd,0 28px 30px -10px rgba(0,0,0,.5),0 8px 12px -4px rgba(0,0,0,.35)}
.bk.hc .f{border-radius:2px 4px 4px 2px;box-shadow:0 0 0 1.5px rgba(0,0,0,.38),calc(var(--th)*.4) 0 0 #f1eee6,var(--th) 0 0 #c9c5ba,0 calc(var(--th)*.4) 0 #ece9e2,0 30px 32px -10px rgba(0,0,0,.55),0 8px 12px -4px rgba(0,0,0,.4)}
.bk .f img{width:100%;height:100%;object-fit:var(--fit,cover);display:block}
.bk .f:before{content:"";position:absolute;inset:0 auto 0 0;width:11%;z-index:2;background:linear-gradient(90deg,rgba(0,0,0,.36),rgba(0,0,0,.05) 52%,rgba(255,255,255,.18) 60%,rgba(0,0,0,.3) 67%,transparent)}
.bk.bd .f:before{width:13%;background:repeating-linear-gradient(0deg,rgba(255,255,255,.05) 0 2px,transparent 2px 4px),linear-gradient(90deg,rgba(0,0,0,.5),rgba(0,0,0,.12) 60%,rgba(255,255,255,.2) 68%,rgba(0,0,0,.3) 76%,transparent)}
.bk.manga .f:before{width:7%;background:linear-gradient(90deg,rgba(0,0,0,.3),rgba(255,255,255,.28) 40%,rgba(0,0,0,.18) 70%,transparent)}
.bk .f:after{content:"";position:absolute;inset:0;z-index:3;pointer-events:none;background:linear-gradient(112deg,rgba(255,255,255,.3),rgba(255,255,255,.05) 24%,transparent 42%,transparent 72%,rgba(0,0,0,.22)),radial-gradient(120% 60% at 30% 0,rgba(255,255,255,.18),transparent 60%)}
.bk.bd .f:after{background:linear-gradient(112deg,rgba(255,255,255,.42),rgba(255,255,255,.08) 20%,transparent 38%,transparent 66%,rgba(255,255,255,.1) 74%,transparent 80%,rgba(0,0,0,.25)),radial-gradient(100% 50% at 25% 0,rgba(255,255,255,.22),transparent 60%)}
.bk.manga .f:after{background:linear-gradient(100deg,rgba(255,255,255,.2),transparent 30%,transparent 80%,rgba(0,0,0,.14)),repeating-linear-gradient(60deg,rgba(255,255,255,.025) 0 1px,transparent 1px 3px)}
.bk .sp{position:absolute;left:0;top:0;bottom:0;width:8%;z-index:4;display:flex;align-items:center;justify-content:center;overflow:hidden}
.bk .sp span{writing-mode:vertical-rl;transform:rotate(180deg);font:700 4.2cqw/1 var(--fd);letter-spacing:.16em;color:var(--sc);opacity:.85;white-space:nowrap;max-height:90%;overflow:hidden}
.bk .sh{position:absolute;left:4%;right:2%;bottom:-5%;height:7%;background:radial-gradient(closest-side,rgba(0,0,0,.38),transparent);z-index:-1}
.bk .tm{position:absolute;right:7%;bottom:6%;z-index:5;width:15cqw;aspect-ratio:1;border-radius:50%;display:grid;place-items:center;background:#f3d36b;color:#2b1c05;font:800 6.4cqw var(--fd);box-shadow:0 2px 5px rgba(0,0,0,.45),inset 0 0 0 1.2px rgba(0,0,0,.2);transform:rotate(-8deg)}
.gc{position:absolute;inset:0;padding:15% 11% 11% 17%;display:flex;flex-direction:column;justify-content:space-between;align-items:center;text-align:center;color:var(--sc);background:radial-gradient(90% 70% at 50% 25%,rgba(255,255,255,.16),transparent 70%)}
.gc:before{content:"";position:absolute;inset:5% 5% 5% 12%;border:1px solid currentColor;opacity:.3;border-radius:2px}
.gc b{font:800 11cqw/1.08 var(--fd);margin-top:8%;overflow:hidden;display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical}
.gc i{width:18%;height:2px;background:currentColor;opacity:.5}
.gc u{font:600 5.2cqw var(--fb);text-decoration:none;letter-spacing:.18em;opacity:.8}
.bd .gc{background:radial-gradient(circle,rgba(255,255,255,.2) 1.4px,transparent 1.9px) 0 0/9px 9px,radial-gradient(90% 70% at 50% 25%,rgba(255,255,255,.18),transparent 70%)}
.manga .gc{background:repeating-conic-gradient(from 0deg at 55% 62%,rgba(255,255,255,.14) 0 3deg,transparent 3deg 8deg)}
.manga .gc b{font-size:12cqw;text-transform:uppercase}
.dm{position:absolute;left:10px;top:6px;z-index:6;font-size:11px;font-weight:700;padding:3px 10px;border-radius:20px;background:var(--glass2);border:1px solid var(--line)}
/* étagères */
.bc{position:relative;cursor:pointer;display:grid;gap:6px;align-content:start}
.bc .cv{position:relative;height:236px;display:flex;align-items:flex-end;justify-content:center;padding-bottom:12px}
.bc .cv:after{content:"";position:absolute;left:-9px;right:-9px;bottom:0;height:14px;background:linear-gradient(#b0804f,#6d4423 55%,#4a2c15);box-shadow:0 10px 16px -4px rgba(0,0,0,.45),inset 0 1px 0 rgba(255,255,255,.28);z-index:0}
.bc .cv .bk{--w:min(128px,72%);z-index:1}
.bc:hover .cv .bk{transform:translateY(-9px) rotate(-1.2deg)}
.bc h3{font-size:15px;line-height:1.2;font-weight:700;letter-spacing:0;padding-top:4px}.bc small{color:var(--mut);font-size:12.5px}
.pr{display:flex;gap:8px;align-items:baseline;font-size:14px}.pr b{font-weight:700}.pr s{color:var(--mut);font-size:12px}.pr .fr{color:#2f7d4a;font-weight:700}
.bc em{position:absolute;top:6px;right:6px;font-style:normal;font-weight:700;font-size:11.5px;padding:3px 9px;border-radius:20px;background:var(--red);color:#fff;z-index:6}
.qa{position:absolute;right:4px;top:6px;z-index:7;width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--brd);box-shadow:var(--sh1);opacity:0;transform:scale(.8);transition:.25s var(--ease)}
.bc:hover .qa,.qa.in{opacity:1;transform:none}.qa.in{background:var(--brass);color:#fff}
@media(hover:none){.qa{opacity:1;transform:none}}
.bc.has em+.qa{top:34px}
.pgb{height:5px;border-radius:5px;background:var(--line);overflow:hidden}.pgb i{display:block;height:100%;background:linear-gradient(90deg,var(--brass),#e3bb62);border-radius:5px}
.mk{position:absolute;top:8px;left:8px;z-index:8;display:none;gap:4px}.ed .mk{display:flex}
.mk button{width:32px;height:32px;border-radius:50%;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--line);box-shadow:var(--sh1);color:var(--ink)}
.mk button.dl{color:var(--red)}
/* défilement automatique */
.mq{max-width:1200px;margin:26px auto 0;overflow:hidden;-webkit-mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);mask:linear-gradient(90deg,transparent,#000 7%,#000 93%,transparent);padding:14px 0 4px}
.mq-t{display:flex;width:max-content;animation:mq 70s linear infinite}.mq:hover .mq-t{animation-play-state:paused}@keyframes mq{to{transform:translateX(-50%)}}
.mq .it{position:relative;margin-right:28px;padding-bottom:16px;cursor:pointer}.mq .it .bk{--w:92px}.mq .it:hover .bk{transform:translateY(-8px)}
.mq .it:after{content:"";position:absolute;left:0;right:-28px;bottom:0;height:11px;background:linear-gradient(#b0804f,#6d4423 55%,#4a2c15);box-shadow:0 8px 12px -4px rgba(0,0,0,.4),inset 0 1px 0 rgba(255,255,255,.25);z-index:-1}
/* grandes affiches */
.po{position:relative;max-width:1200px;margin:34px auto 0;border-radius:28px;overflow:hidden;min-height:360px;display:grid;grid-template-columns:minmax(0,30%) 1fr;gap:7%;align-items:center;padding:46px 8%;color:var(--tx);background:radial-gradient(120% 130% at 85% 0,var(--b1),var(--b2));box-shadow:var(--sh2)}
.po>*{position:relative}.po .bgi{position:absolute;inset:0;background-size:cover;background-position:center;opacity:.32;mix-blend-mode:luminosity}
.po.r{grid-template-columns:1fr minmax(0,30%)}.po.r .bk{order:2}
.po .bk{--w:min(250px,100%)}.po h3{font-size:clamp(26px,4.2vw,56px)}
.po .seal{position:absolute;top:22px;right:26px;width:98px;height:98px;border-radius:50%;display:grid;place-items:center;text-align:center;padding:12px;background:radial-gradient(circle at 30% 30%,#ecd083,#a87a1f);color:#2b1c05;font:800 13px/1.15 var(--fd);transform:rotate(12deg);box-shadow:0 8px 20px rgba(0,0,0,.4),inset 0 0 0 4px rgba(255,255,255,.25),inset 0 0 0 6px rgba(0,0,0,.12);z-index:3}
.po.r .seal{right:auto;left:26px}
/* barre d'outils */
.tb{max-width:1200px;margin:34px auto 6px;padding:0 20px;display:grid;gap:14px}
.tabs{display:flex;gap:8px;flex-wrap:wrap}
.tab,.chip{padding:10px 18px;border-radius:40px;font-weight:600;font-size:14px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--brd);box-shadow:var(--sh1);display:inline-flex;align-items:center;gap:8px;transition:.25s var(--ease);white-space:nowrap;color:var(--ink)}
.tab.on,.chip.on{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 8px;scrollbar-width:none}.chips::-webkit-scrollbar{display:none}.chip{font-size:13px;padding:8px 15px}
.srch{position:relative}.srch svg{z-index:2;pointer-events:none;position:absolute;left:16px;top:50%;transform:translateY(-50%);color:var(--mut)}
.srch input{width:100%;font:inherit;padding:13px 18px 13px 44px;border-radius:40px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--brd);box-shadow:var(--sh1);color:var(--ink)}
.eds{display:none;gap:8px;flex-wrap:wrap;padding:12px;border-radius:20px;border:1.5px dashed var(--red);background:var(--red-s)}.ed .eds{display:flex}.eds .btn{padding:9px 16px;font-size:13px}
.hint{width:100%;font-size:12.5px;color:var(--t2)}
.sec{max-width:1200px;margin:34px auto 0;padding:0 20px}
.sec h2{font-size:clamp(22px,3vw,32px);margin-bottom:18px;display:flex;align-items:center;gap:14px}.sec h2:after{content:"";flex:1;height:1px;background:linear-gradient(90deg,var(--brass),transparent)}.sec h2 .btn{order:3;padding:8px 16px;font-size:13px}
.rail{display:flex;gap:18px;overflow-x:auto;scroll-snap-type:x mandatory;padding:6px 10px 20px;scrollbar-width:none}.rail::-webkit-scrollbar{display:none}.rail .bc{flex:0 0 160px;scroll-snap-align:start}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:26px 18px}
.empty{padding:40px 20px;text-align:center;color:var(--mut);border:1.5px dashed var(--line);border-radius:20px}
.how{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.how div{padding:22px;border-radius:22px;background:var(--glass);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border:1px solid var(--brd);box-shadow:var(--sh1);display:grid;gap:6px}
.how svg{width:26px;height:26px;color:var(--brass)}.how b{font:700 17px var(--fd)}.how span{color:var(--t2);font-size:14px}
.edfab{position:fixed;left:16px;bottom:calc(88px + env(safe-area-inset-bottom,0px));z-index:900;display:none;padding:13px 20px}
.cbtn{position:fixed;right:16px;bottom:calc(152px + env(safe-area-inset-bottom,0px));z-index:900;width:54px;height:54px;border-radius:50%;display:grid;place-items:center;background:var(--glass2);border:1px solid var(--brd);box-shadow:var(--sh2);color:var(--ink);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px)}
.cbtn.bump{animation:bump .5s var(--ease)}@keyframes bump{40%{transform:scale(1.22) rotate(-6deg)}}
.cbtn b{position:absolute;top:-4px;right:-4px;min-width:20px;height:20px;border-radius:10px;padding:0 5px;background:var(--red);color:#fff;font:700 11px/20px var(--fb);text-align:center;display:none}.cbtn.has b{display:block}
.sk{background:linear-gradient(100deg,var(--s2) 30%,var(--surface) 50%,var(--s2) 70%);background-size:200% 100%;animation:sk 1.3s infinite;border-radius:14px}@keyframes sk{to{background-position:-200% 0}}
/* fiche */
.ov2{position:fixed;inset:0;z-index:1500;background:rgba(18,10,4,.6);backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);display:none;overflow-y:auto;padding:14px}.ov2.on{display:block}
.pn{max-width:1040px;margin:30px auto;background:var(--glass2);backdrop-filter:blur(22px);-webkit-backdrop-filter:blur(22px);border:1px solid var(--brd);border-radius:28px;box-shadow:var(--sh2);position:relative;overflow:hidden;color:var(--ink)}
