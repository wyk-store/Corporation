name: Pages de partage produit

# Toutes les 20 min : fiches produit /produit/<id> (HTML + image de partage) puis sitemap.xml.
on:
  schedule:
    - cron: '*/20 * * * *'
  workflow_dispatch:
  push:
    paths:
      - 'tools/generate-share.cjs'
      - 'tools/product-page.cjs'
      - 'tools/generate-sitemap.cjs'

permissions:
  contents: write

concurrency:
  group: share-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Y a-t-il quelque chose à générer ?
        id: plan
        run: |
          echo "n=$(node tools/generate-share.cjs --plan)" >> "$GITHUB_OUTPUT"
          echo "img=$(node tools/generate-share.cjs --plan-img)" >> "$GITHUB_OUTPUT"
      # Chromium seulement si des IMAGES de partage sont à (re)générer ; les fiches HTML n'en ont pas besoin.
      - name: Installer Chromium
        if: steps.plan.outputs.img != '0'
        run: |
          npm i --no-save playwright@1
          npx playwright install --with-deps chromium
      - name: Générer les fiches et images
        if: steps.plan.outputs.n != '0'
        run: node tools/generate-share.cjs
      - name: Enregistrer les fiches
        if: steps.plan.outputs.n != '0'
        run: |
          git config user.name "wyk-bot"
          git config user.email "wyk-bot@users.noreply.github.com"
          git add produit livre og
          git diff --cached --quiet || (git commit -m "Fiches produit (auto)" && git pull --rebase origin "${GITHUB_REF_NAME}" && git push)
      # Si ce script échoue (code 1) le job devient rouge et sitemap.xml reste celui qui existait.
      - name: Sitemap (pages, catégories, fiches indexables)
        run: node tools/generate-sitemap.cjs
      - name: Enregistrer le sitemap
        run: |
          git config user.name "wyk-bot"
          git config user.email "wyk-bot@users.noreply.github.com"
          git add sitemap.xml
          if git diff --cached --quiet; then echo "Sitemap inchangé."; exit 0; fi
          git commit -m "Sitemap (auto)"
          git pull --rebase origin "${GITHUB_REF_NAME}"
          git push
