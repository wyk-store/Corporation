    L.forEach(function(i){var pk=i.pack?{n:i.pack_n||1,label:i.pack}:null,key=i.id+(i.size?'_'+i.size:'')+(i.color?'_'+i.color:'')+(pk?'_pk':''),it=cart.filter(function(x){return x.key===key})[0],q=Number(i.qty)||1;
      if(it)it.qty+=q;else cart.push({key:key,id:i.id,name:i.name,price:Number(i.price)||0,img:i.img||null,size:i.size||null,color:i.color||null,sku:i.sku||null,qty:q,pk:pk})});
    try{localStorage.setItem('wyk_cart',JSON.stringify(cart))}catch(e){}
    toast('Articles ajoutés à votre panier');setTimeout(function(){location.href='/commande'},500)};
}
init();
})();
