<style>
/* WYK — design system v2 (inspiré Winfum : en-tête verre, carrousels, fiche pro) */
:root{--bg:#f6f5f2;--surface:#fff;--s2:#efeeea;--ink:#101010;--t2:#4a4a44;--mut:rgba(16,16,16,.56);--line:rgba(16,16,16,.11);
--red:#e8192c;--red-d:#bf0f20;--red-s:rgba(232,25,44,.09);--gold:#f5c842;--glass:rgba(255,255,255,.66);--glass2:rgba(255,255,255,.92);--brd:rgba(255,255,255,.75);
--r:20px;--sh1:0 2px 10px rgba(0,0,0,.06);--sh2:0 14px 40px rgba(0,0,0,.12);--ease:cubic-bezier(.2,.7,.2,1);
--fd:'Bricolage Grotesque','Inter',system-ui,sans-serif;--fb:'Inter',system-ui,sans-serif;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme="dark"]{--bg:#0d0d0c;--surface:#171716;--s2:#20201e;--ink:#f3f2ec;--t2:#b4b3aa;--mut:rgba(243,242,236,.58);--line:rgba(243,242,236,.13);--red-s:rgba(232,25,44,.16);--glass:rgba(24,24,22,.62);--glass2:rgba(24,24,22,.92);--brd:rgba(255,255,255,.09);--sh1:0 2px 10px rgba(0,0,0,.4);--sh2:0 14px 40px rgba(0,0,0,.55)}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{scroll-behavior:smooth;scroll-padding-top:96px}
body{font-family:var(--fb);background:var(--bg);color:var(--ink);overflow-x:hidden;-webkit-font-smoothing:antialiased;line-height:1.5}
a{color:inherit;text-decoration:none}img{max-width:100%;display:block}button{font:inherit;color:inherit;cursor:pointer;border:none;background:none}
h1,h2,h3,h4{font-family:var(--fd);letter-spacing:-.02em;line-height:1.05}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.tag{font-size:11px;font-weight:600;letter-spacing:.24em;text-transform:uppercase;color:var(--red)}
.glass{background:var(--glass);backdrop-filter:blur(18px) saturate(150%);-webkit-backdrop-filter:blur(18px) saturate(150%);border:1px solid var(--brd)}
.reveal{opacity:0;transform:translateY(24px);transition:opacity .7s var(--ease),transform .7s var(--ease)}.reveal.in{opacity:1;transform:none}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;padding:13px 24px;border-radius:40px;font-weight:600;font-size:14px;transition:.25s var(--ease)}
.btn-red{background:linear-gradient(120deg,var(--red),#ff4b5c);color:#fff;box-shadow:0 8px 22px rgba(232,25,44,.32)}.btn-red:hover{transform:translateY(-2px);box-shadow:0 12px 28px rgba(232,25,44,.42)}
.btn-dark{background:var(--ink);color:var(--bg)}.btn-line{border:1.5px solid var(--line)}.btn-line:hover{border-color:var(--ink)}
.btn-wa{background:#25d366;color:#fff;box-shadow:0 8px 22px rgba(37,211,102,.3)}
/* ticker */
.ticker{background:var(--ink);color:var(--bg);font-size:12px;font-weight:500;overflow:hidden;white-space:nowrap;height:32px;display:flex;align-items:center;position:relative;z-index:101}
.ticker-in{display:inline-flex;gap:56px;padding-left:100%;animation:tk 38s linear infinite}.ticker:hover .ticker-in{animation-play-state:paused}
.ticker-in span:before{content:"●";color:var(--red);margin-right:10px;font-size:8px;vertical-align:1px}
@keyframes tk{to{transform:translateX(-100%)}}
/* header */
.hdr{position:sticky;top:0;z-index:100;padding:10px 12px 0}
.bar{display:flex;align-items:center;gap:14px;max-width:1280px;margin:0 auto;padding:9px 12px 9px 22px;border-radius:44px;box-shadow:var(--sh1)}
.brand{display:flex;align-items:center;gap:9px;font:800 22px var(--fd);letter-spacing:-.03em;flex:none}.brand img{width:32px;height:32px;object-fit:contain}.brand em{font-style:normal;color:var(--red)}
.nav{display:flex;gap:4px;margin-left:10px}.nav>a,.nav>button,.nav summary{padding:9px 14px;border-radius:30px;font-size:13px;font-weight:500;color:var(--t2);transition:.2s;list-style:none;cursor:pointer;display:flex;align-items:center;gap:5px}
.nav>a:hover,.nav summary:hover,.nav details[open] summary{background:var(--red-s);color:var(--red)}.nav summary::-webkit-details-marker{display:none}
.nav details{position:relative}
.mega{position:absolute;top:calc(100% + 14px);left:-20px;width:min(640px,86vw);padding:14px;border-radius:24px;display:grid;grid-template-columns:repeat(2,1fr);gap:6px;box-shadow:var(--sh2);background:var(--glass2);backdrop-filter:blur(20px);border:1px solid var(--brd);z-index:150}
.mega a{display:flex;align-items:center;gap:12px;padding:10px;border-radius:16px;font-size:13.5px;font-weight:500;transition:.2s}.mega a:hover{background:var(--red-s)}
.mega .mi{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;flex:none;overflow:hidden;font-size:18px}.mega .mi img{width:24px;height:24px;object-fit:contain}.mega small{display:block;color:var(--mut);font-size:11px;font-weight:400}
.mega .all{grid-column:1/-1;justify-content:center;background:var(--ink);color:var(--bg);margin-top:4px}
.hsearch{flex:1;max-width:340px;margin-left:auto;display:flex;align-items:center;gap:9px;padding:10px 16px;border-radius:30px;background:var(--s2);color:var(--mut);font-size:13px;text-align:left;transition:.2s}.hsearch:hover{background:var(--red-s)}
.hsearch svg,.ib svg{width:18px;height:18px;flex:none}
.hr{display:flex;align-items:center;gap:4px;flex:none}
.ib{position:relative;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;transition:.2s}.ib:hover{background:var(--red-s);color:var(--red)}
.ib .bd{position:absolute;top:2px;right:0;min-width:17px;height:17px;border-radius:9px;background:var(--red);color:#fff;font-size:10px;font-weight:700;display:none;align-items:center;justify-content:center;padding:0 4px}.ib .bd.on{display:flex}
.ib .sun{display:none}[data-theme=dark] .ib .sun{display:block}[data-theme=dark] .ib .moon{display:none}
.burger{display:none}
/* overlays */
.ov{position:fixed;inset:0;background:rgba(10,10,10,.5);backdrop-filter:blur(5px);z-index:300;opacity:0;pointer-events:none;transition:.3s}.ov.on{opacity:1;pointer-events:auto}
.sbox{width:min(680px,94vw);margin:8vh auto 0;background:var(--surface);border-radius:26px;padding:18px;box-shadow:var(--sh2);max-height:80vh;overflow:auto}
.sfield{display:flex;align-items:center;gap:10px;padding:6px 8px 14px;border-bottom:1px solid var(--line)}.sfield input{flex:1;border:none;outline:none;background:none;font-size:17px;color:var(--ink)}
.sfield svg{width:20px;color:var(--mut)}.esc{font-size:12px;padding:6px 12px;border-radius:20px;background:var(--s2)}
.chips{display:flex;flex-wrap:wrap;gap:8px;padding:14px 4px 4px}.chip{padding:8px 14px;border-radius:30px;background:var(--s2);font-size:12.5px;font-weight:500;cursor:pointer;transition:.2s;border:1px solid transparent}.chip:hover,.chip.on{background:var(--red-s);color:var(--red);border-color:var(--red)}
.sres{display:grid;gap:4px;padding-top:10px}.srow{display:flex;gap:12px;align-items:center;padding:8px;border-radius:16px;cursor:pointer}.srow:hover{background:var(--s2)}
.srow img,.srow .ph{width:54px;height:54px;border-radius:12px;object-fit:cover;background:var(--s2);flex:none}.srow b{font-size:14px;display:block}.srow span{font-size:12px;color:var(--mut)}.srow i{margin-left:auto;font-style:normal;font-weight:700;font-size:13px;white-space:nowrap}
.drawer{position:fixed;top:0;right:0;bottom:0;width:min(430px,100vw);background:var(--surface);z-index:310;transform:translateX(105%);transition:transform .45s var(--ease);display:flex;flex-direction:column;box-shadow:var(--sh2)}.drawer.on{transform:none}
.drawer.left{right:auto;left:0;transform:translateX(-105%)}.drawer.left.on{transform:none}
.dh{display:flex;align-items:center;justify-content:space-between;padding:20px 22px;border-bottom:1px solid var(--line)}.dh h3{font-size:22px}.dx{width:36px;height:36px;border-radius:50%;background:var(--s2);font-size:16px}
.db{flex:1;overflow:auto;padding:14px 18px}.df{padding:18px 22px calc(18px + env(safe-area-inset-bottom,0px));border-top:1px solid var(--line);display:grid;gap:12px}
.ci{display:flex;gap:12px;align-items:center;padding:12px 0;border-bottom:1px solid var(--line)}.ci img,.ci .ph{width:64px;height:64px;border-radius:14px;object-fit:cover;background:var(--s2);flex:none}.ci b{font-size:14px;display:block;line-height:1.3}.ci small{color:var(--mut);font-size:12px}
.qty{display:inline-flex;align-items:center;gap:2px;background:var(--s2);border-radius:30px;padding:3px}.qty button{width:30px;height:30px;border-radius:50%;font-weight:700}.qty button:hover{background:var(--surface)}.qty span{min-width:26px;text-align:center;font-weight:600;font-size:14px}
.tot{display:flex;justify-content:space-between;font-size:17px;font-weight:700}
.empty{text-align:center;padding:60px 20px;color:var(--mut)}.empty b{display:block;font:700 20px var(--fd);color:var(--ink);margin-bottom:6px}
.menu-link{display:flex;align-items:center;gap:14px;padding:13px 14px;border-radius:16px;font-weight:500;font-size:15px}.menu-link:hover{background:var(--red-s)}.menu-sub{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--mut);padding:16px 14px 6px}
/* hero carousel */
.hero{position:relative;padding:14px 12px 0}.hs{position:relative;max-width:1280px;margin:0 auto;border-radius:34px;overflow:hidden;min-height:clamp(380px,56vh,560px);background:#111}
.hs-track{display:flex;height:100%;min-height:inherit;transition:transform .8s var(--ease)}
.slide{flex:0 0 100%;position:relative;min-height:inherit;display:flex;align-items:center;padding:clamp(28px,6vw,80px);color:#fff;overflow:hidden;background:var(--sbg,linear-gradient(120deg,#e8192c,#8f0b18))}
.slide:before{content:"";position:absolute;width:70%;aspect-ratio:1;right:-12%;top:-30%;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.22),transparent 65%);animation:fl 9s ease-in-out infinite alternate}
.slide:after{content:"";position:absolute;width:46%;aspect-ratio:1;left:-8%;bottom:-40%;border-radius:50%;background:radial-gradient(circle,rgba(0,0,0,.3),transparent 65%)}
@keyframes fl{to{transform:translate(-6%,8%) scale(1.15)}}
.slide .in{position:relative;z-index:2;max-width:560px}.slide .pill{display:inline-block;padding:7px 16px;border-radius:30px;background:rgba(255,255,255,.18);backdrop-filter:blur(8px);font-size:11px;letter-spacing:.2em;text-transform:uppercase;font-weight:600;margin-bottom:18px;border:1px solid rgba(255,255,255,.3)}
.slide h2{font-size:clamp(34px,6.4vw,72px);font-weight:800}.slide p{margin-top:16px;font-size:clamp(14px,1.8vw,18px);opacity:.88;max-width:460px}
.slide .btn{margin-top:26px;background:#fff;color:#111;box-shadow:0 12px 30px rgba(0,0,0,.25)}
.slide .art{position:absolute;right:5%;top:50%;transform:translateY(-50%);display:grid;grid-template-columns:repeat(2,1fr);gap:14px;width:min(40%,380px);z-index:2}
.slide .art div{aspect-ratio:1;border-radius:26px;background:rgba(255,255,255,.14);backdrop-filter:blur(6px);border:1px solid rgba(255,255,255,.26);overflow:hidden;display:grid;place-items:center;font-size:44px;box-shadow:0 20px 40px rgba(0,0,0,.2)}
.slide .art div:nth-child(2){transform:translateY(26px)}.slide .art img{width:100%;height:100%;object-fit:cover}
.arr{position:absolute;top:50%;transform:translateY(-50%);width:46px;height:46px;border-radius:50%;background:rgba(255,255,255,.2);backdrop-filter:blur(10px);color:#fff;font-size:22px;z-index:5;border:1px solid rgba(255,255,255,.3);transition:.2s}.arr:hover{background:#fff;color:#111}.arr.l{left:16px}.arr.r{right:16px}
.dots{display:flex;gap:7px;justify-content:center;padding:14px 0 0}.dots i{width:8px;height:8px;border-radius:8px;background:var(--line);cursor:pointer;transition:.35s}.dots i.on{width:30px;background:var(--red)}
.th-blue{--sbg:linear-gradient(120deg,#1d4ed8,#0b1f6b)}.th-green{--sbg:linear-gradient(120deg,#059669,#064e3b)}.th-dark{--sbg:linear-gradient(120deg,#1f1f1f,#000)}.th-purple{--sbg:linear-gradient(120deg,#7c3aed,#3b0a8c)}.th-gold{--sbg:linear-gradient(120deg,#f59e0b,#b45309)}.th-orange{--sbg:linear-gradient(120deg,#f97316,#c2410c)}.th-pink{--sbg:linear-gradient(120deg,#ec4899,#9d174d)}
/* trust */
.trust{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;margin-top:22px}.tr{display:flex;align-items:center;gap:12px;padding:16px 18px;border-radius:20px;background:var(--surface);border:1px solid var(--line)}
.tr svg{width:26px;height:26px;color:var(--red);flex:none}.tr b{font-size:13.5px;display:block}.tr span{font-size:12px;color:var(--mut)}
/* sections */
.sec{padding:clamp(40px,7vw,84px) 0 0}.sh{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;margin-bottom:24px}.sh h1,.sh h2{font-size:clamp(28px,4.4vw,46px);margin-top:8px;font-weight:800}.sh .more{font-size:13px;font-weight:600;display:flex;align-items:center;gap:6px;white-space:nowrap;color:var(--red)}
/* category vignettes */
.cats{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:16px}
.cat{position:relative;border-radius:26px;padding:22px;min-height:190px;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;background:var(--cb,#fff0f1);color:var(--ct,#111);transition:.4s var(--ease);isolation:isolate}
.cat:hover{transform:translateY(-6px) rotate(-.4deg);box-shadow:var(--sh2)}
.cat .ico{position:absolute;top:18px;left:18px;width:58px;height:58px;border-radius:18px;background:rgba(255,255,255,.62);backdrop-filter:blur(6px);display:grid;place-items:center;font-size:28px;z-index:2}.cat .ico img{width:34px;height:34px;object-fit:contain}.cat .ico svg{width:30px;height:30px}
.cat:before{content:"";position:absolute;width:150px;height:150px;border-radius:50%;right:-40px;top:-40px;background:rgba(255,255,255,.35);z-index:-1;transition:.5s var(--ease)}.cat:hover:before{transform:scale(1.5)}
.cat b{font:700 20px var(--fd);letter-spacing:-.02em}.cat span{font-size:12px;opacity:.7;margin-top:2px}.cat .go{position:absolute;right:16px;top:18px;width:34px;height:34px;border-radius:50%;background:var(--ct,#111);color:#fff;display:grid;place-items:center;font-size:15px;opacity:0;transform:translateX(-8px);transition:.3s}.cat:hover .go{opacity:1;transform:none}
.catbar{display:flex;gap:12px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 8px}.catbar::-webkit-scrollbar{display:none}
.cb{flex:none;display:flex;flex-direction:column;align-items:center;gap:9px;width:92px;font-size:12px;font-weight:500;text-align:center}.cb i{width:78px;height:78px;border-radius:50%;background:var(--cb,#fff0f1);display:grid;place-items:center;font-size:32px;font-style:normal;transition:.35s var(--ease);border:2px solid transparent;overflow:hidden}.cb i img{width:44px;height:44px;object-fit:contain}.cb:hover i,.cb.on i{transform:translateY(-4px) scale(1.06);border-color:var(--red);box-shadow:0 10px 22px rgba(232,25,44,.2)}
/* rails */
.rail-w{position:relative}.rail{display:flex;gap:16px;overflow-x:auto;scroll-snap-type:x mandatory;scrollbar-width:none;padding:6px 2px 18px;scroll-behavior:smooth}.rail::-webkit-scrollbar{display:none}.rail>*{scroll-snap-align:start;flex:none;width:clamp(180px,22vw,264px)}
.rn{position:absolute;top:42%;width:44px;height:44px;border-radius:50%;background:var(--surface);box-shadow:var(--sh2);font-size:20px;z-index:4;border:1px solid var(--line);transition:.2s}.rn:hover{background:var(--ink);color:var(--bg)}.rn.l{left:-14px}.rn.r{right:-14px}
.card{position:relative;background:var(--surface);border-radius:24px;overflow:hidden;border:1px solid var(--line);cursor:pointer;transition:.4s var(--ease);display:flex;flex-direction:column}.card:hover{transform:translateY(-6px);box-shadow:var(--sh2)}
.card .im{position:relative;aspect-ratio:1/1.05;background:var(--s2);overflow:hidden}.card .im img{width:100%;height:100%;object-fit:cover;transition:transform .8s var(--ease)}.card:hover .im img{transform:scale(1.07)}
.card .im .ph{width:100%;height:100%;display:grid;place-items:center;font-size:40px;opacity:.35}
.bdg{position:absolute;left:12px;top:12px;padding:5px 11px;border-radius:20px;font-size:10px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;background:var(--ink);color:var(--bg);z-index:2}.bdg.promo{background:var(--red);color:#fff}.bdg.new{background:#059669;color:#fff}.bdg.pop{background:var(--gold);color:#111}
.wish{position:absolute;right:10px;top:10px;width:36px;height:36px;border-radius:50%;background:var(--glass2);backdrop-filter:blur(8px);display:grid;place-items:center;z-index:2;transition:.2s}.wish svg{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:2}.wish.on{color:var(--red)}.wish.on svg{fill:var(--red)}.wish:hover{transform:scale(1.12)}
.card .bo{padding:14px 16px 16px;display:flex;flex-direction:column;gap:5px;flex:1}.card .ct{font-size:11px;letter-spacing:.12em;text-transform:uppercase;color:var(--mut)}.card h3{font:600 15px/1.3 var(--fb);letter-spacing:0;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.6em}
.pr{display:flex;align-items:baseline;gap:8px;flex-wrap:wrap;margin-top:auto;padding-top:6px}.pr b{font:800 18px var(--fd)}.pr s{font-size:12px;color:var(--mut)}.pr em{font-style:normal;font-size:11px;font-weight:700;color:var(--red);background:var(--red-s);padding:2px 8px;border-radius:20px}
.add{position:absolute;right:12px;bottom:12px;width:40px;height:40px;border-radius:50%;background:var(--ink);color:var(--bg);font-size:20px;display:grid;place-items:center;transition:.25s}.add:hover{background:var(--red);color:#fff;transform:scale(1.1) rotate(90deg)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:18px}
.skel{border-radius:24px;aspect-ratio:1/1.4;background:linear-gradient(100deg,var(--s2) 30%,var(--surface) 50%,var(--s2) 70%);background-size:300% 100%;animation:sk 1.3s infinite}@keyframes sk{to{background-position:-150% 0}}
/* promo banners */
.dual{display:grid;grid-template-columns:1.4fr 1fr;gap:16px}.bn{position:relative;border-radius:30px;padding:clamp(26px,4vw,44px);min-height:240px;color:#fff;overflow:hidden;display:flex;flex-direction:column;justify-content:flex-end;background:linear-gradient(130deg,#e8192c,#7d0a17)}.bn.b2{background:linear-gradient(130deg,#111,#3a3a36)}
.bn:before{content:"";position:absolute;inset:auto -10% -50% auto;width:70%;aspect-ratio:1;border-radius:50%;background:radial-gradient(circle,rgba(255,255,255,.2),transparent 65%)}.bn h3{font-size:clamp(24px,3.4vw,38px);position:relative}.bn p{opacity:.85;margin:8px 0 18px;font-size:14px;position:relative;max-width:380px}.bn .btn{align-self:flex-start;background:#fff;color:#111;position:relative}
.bn .badge{position:absolute;top:22px;left:26px;padding:6px 14px;border-radius:20px;background:rgba(255,255,255,.2);font-size:11px;letter-spacing:.15em;font-weight:700;text-transform:uppercase}
/* footer */
