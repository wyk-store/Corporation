<!doctype html>
<html lang="fr" data-theme="light"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline' https://cdn.jsdelivr.net; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://byrklytqoucdskzvcoau.supabase.co wss://byrklytqoucdskzvcoau.supabase.co; object-src 'none'; base-uri 'self'; form-action 'self'; frame-src 'none'"><meta name="referrer" content="strict-origin-when-cross-origin"><meta name="color-scheme" content="light dark">
<title>Administration — WYK STAFF</title><meta name="robots" content="noindex, nofollow, noarchive">
<link rel="icon" href="/favicon.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Inter:wght@400;500;600;700&family=Montserrat:wght@400;500;600;700;800&family=Caveat:wght@600&display=swap">
<link rel="stylesheet" href="/staff.css">
</head><body>
<header id="top"></header>
<main><div class="wrap" id="root"><div class="nm card empty">Chargement…</div></div></main>
<div class="modal" id="modal"><div class="nm box"><button class="ib cl" id="mx" aria-label="Fermer"></button><div id="mb"></div></div></div>
<footer id="foot"></footer>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="/staff.js"></script>
<script>
(async function(){
var esc=S.esc,db=S.db,root=document.getElementById('root'),tab='dash';
var user=await S.shell('');
var nf=function(){root.innerHTML='<section class="nm card nf" style="max-width:640px;margin:30px auto"><b>404</b><h2 style="font-size:26px;margin:10px 0 8px">Page introuvable</h2><p class="mut">Cette page n\'existe pas ou a été déplacée.</p><p style="margin-top:22px"><a class="btn pri" href="/">Retour à l\'accueil</a></p></section>'};
if(!user||!S.admin){nf();return}

var D={pos:[],cats:[],profs:[],inv:[]};
async function load(){var q=await Promise.all([db.from('staff_positions').select('*').order('sort').order('title'),db.from('staff_categories').select('*').order('sort').order('name'),db.from('staff_profiles').select('*').order('created_at',{ascending:false}),db.from('staff_invites').select('*').order('created_at',{ascending:false})]);
 q.forEach(function(r){if(r.error)S.toast(r.error.message,1)});D.pos=q[0].data||[];D.cats=q[1].data||[];D.profs=q[2].data||[];D.inv=q[3].data||[]}
var posOf=function(id){var p=D.pos.find(function(x){return x.id===id});return p?p.title:'—'};
var catOf=function(id){var c=D.cats.find(function(x){return x.id===id});return c?c.name:'Par défaut'};
var fieldsOf=function(r){var c=D.cats.find(function(x){return x.id===r.category_id})||D.cats.find(function(x){return x.is_default});return c?c.public_fields:[]};
var ALL=S.FIELDS.map(function(f){return f[0]});
function modal(html){document.getElementById('mb').innerHTML=html;document.getElementById('modal').classList.add('open')}
function closeM(){document.getElementById('modal').classList.remove('open');document.getElementById('mb').innerHTML=''}
document.getElementById('mx').innerHTML=S.ic('x');document.getElementById('mx').onclick=closeM;
document.getElementById('modal').onclick=function(e){if(e.target.id==='modal')closeM()};
var TABS=[['dash','grid','Tableau de bord'],['profiles','users','Profils'],['invites','key','Invitations'],['cats','shield','Catégories & visibilité'],['pos','tag','Postes']];

function shell(inner){root.innerHTML='<div class="adm"><nav class="nm side">'+TABS.map(function(t){return'<button data-t="'+t[0]+'" class="'+(t[0]===tab?'on':'')+'">'+S.ic(t[1])+'<span>'+t[2]+'</span></button>'}).join('')+'</nav><section id="pane">'+inner+'</section></div>';
 root.querySelector('.side').onclick=function(e){var b=e.target.closest('[data-t]');if(b){tab=b.dataset.t;draw()}}}
function draw(){({dash:dash,profiles:profiles,invites:invites,cats:cats,pos:pos})[tab]()}

/* ---- tableau de bord ---- */
function dash(){var n=function(f){return D.profs.filter(f).length};
 shell('<div class="stats"><div class="nm stat"><b>'+D.profs.length+'</b><span>Profils</span></div><div class="nm stat"><b style="color:var(--ok)">'+n(function(p){return p.status==='active'})+'</b><span>Actifs</span></div><div class="nm stat"><b>'+n(function(p){return p.status==='inactive'})+'</b><span>Inactifs</span></div><div class="nm stat"><b style="color:var(--bad)">'+n(function(p){return p.status==='suspended'||p.status==='review'})+'</b><span>Suspendus / en examen</span></div><div class="nm stat"><b style="color:#2563eb">'+D.inv.filter(function(i){return i.status==='pending'}).length+'</b><span>Invitations en attente</span></div></div>'+
 '<section class="nm card"><h3>'+S.ic('star')+'Démarrer</h3><div style="display:flex;gap:12px;flex-wrap:wrap"><button class="btn pri" data-go="invites">'+S.ic('plus')+'Créer une invitation</button><button class="btn" data-go="cats">'+S.ic('shield')+'Règles de visibilité</button><button class="btn" data-go="pos">'+S.ic('tag')+'Modifier les postes</button></div></section>');
 root.querySelector('#pane').onclick=function(e){var b=e.target.closest('[data-go]');if(b){tab=b.dataset.go;draw()}}}

/* ---- profils ---- */
var pf={q:'',s:''};
function profiles(){
 shell('<div class="tools"><input id="q" placeholder="Rechercher un nom, un ID, un poste…" value="'+esc(pf.q)+'"><select id="s"><option value="">Tous les statuts</option>'+Object.keys(S.STATUS).map(function(k){return'<option value="'+k+'"'+(pf.s===k?' selected':'')+'>'+S.STATUS[k]+'</option>'}).join('')+'</select></div><div class="list" id="ls"></div>');
 function list(){var q=pf.q.toLowerCase();var rows=D.profs.filter(function(p){return(!pf.s||p.status===pf.s)&&(!q||(p.full_name+' '+p.employee_code+' '+posOf(p.position_id)+' '+catOf(p.category_id)).toLowerCase().indexOf(q)>-1)});
  document.getElementById('ls').innerHTML=rows.length?rows.map(function(p){return'<div class="nm li" data-id="'+p.user_id+'"><div class="av">'+(p.photo_url?'<img src="'+esc(p.photo_url)+'" alt="">':esc((p.full_name||'?')[0]))+'</div><div class="info"><b>'+esc(p.full_name)+'</b>'+S.verifiedBadge(p,'sm')+'<span class="small mut">'+esc(posOf(p.position_id))+' · '+esc(catOf(p.category_id))+' · '+esc(p.employee_code)+'</span><br><span class="small mut">Actif depuis '+esc(S.date(p.activated_at))+(p.status_reason?' · '+esc(p.status_reason):'')+'</span></div><span class="pill '+p.status+'">'+S.STATUS[p.status]+'</span><div class="act"><button class="btn sm" data-a="view">'+S.ic('eye')+'Voir</button><button class="btn sm" data-a="edit">'+S.ic('edit')+'Modifier</button><select class="sm" data-a="st" style="width:auto;padding:9px 12px"><option value="">Statut…</option>'+Object.keys(S.STATUS).filter(function(k){return k!==p.status}).map(function(k){return'<option value="'+k+'">'+({active:'Activer',inactive:'Désactiver',suspended:'Suspendre',review:'Mettre en examen'})[k]+'</option>'}).join('')+'</select><button class="btn sm" data-a="vf">'+S.ic('shield')+(p.verified?'Retirer le badge':'Vérifier')+'</button><button class="btn sm" data-a="link" aria-label="Copier le lien">'+S.ic('link')+'</button><button class="btn sm dng" data-a="del" aria-label="Supprimer">'+S.ic('trash')+'</button></div></div>'}).join(''):'<div class="empty">Aucun profil'+(D.profs.length?' ne correspond.':' pour l\'instant. Créez une invitation pour commencer.')+'</div>'}
 list();
 document.getElementById('q').oninput=function(e){pf.q=e.target.value;list()};document.getElementById('s').onchange=function(e){pf.s=e.target.value;list()};
 var host=document.getElementById('ls');
 host.onclick=function(e){var b=e.target.closest('button[data-a]');if(!b)return;var id=b.closest('.li').dataset.id,p=D.profs.find(function(x){return x.user_id===id});
  if(b.dataset.a==='link')return S.copy(S.pubUrl(S.idOf(p)),'Lien du profil copié');
  if(b.dataset.a==='vf'){var nv=!p.verified;return db.from('staff_profiles').update({verified:nv,verified_at:nv?new Date().toISOString():null}).eq('user_id',id).then(function(r){if(r.error)return S.toast(r.error.message,1);S.toast(p.full_name+(nv?' : profil vérifié':' : vérification retirée'));refresh()})}
  if(b.dataset.a==='view')return viewP(p,'public');
  if(b.dataset.a==='edit')return editP(p);
  if(b.dataset.a==='del'){if(!confirm('Supprimer définitivement le profil de '+p.full_name+' ? (Son compte de connexion reste, mais le profil et son ID disparaissent.)'))return;db.from('staff_profiles').delete().eq('user_id',id).then(function(r){if(r.error)return S.toast(r.error.message,1);S.toast('Profil supprimé');refresh()})}};
 host.onchange=async function(e){var s=e.target;if(s.dataset.a!=='st'||!s.value)return;var id=s.closest('.li').dataset.id,p=D.profs.find(function(x){return x.user_id===id}),reason=null;
  if(s.value==='suspended'||s.value==='review'){reason=prompt('Motif (visible par l\'administration uniquement) :','');if(reason===null){s.value='';return}}
  var r=await db.from('staff_profiles').update({status:s.value,status_reason:reason||null}).eq('user_id',id);if(r.error)return S.toast(r.error.message,1);S.toast(p.full_name+' : '+S.STATUS[s.value]);refresh()}}
function posDesc(id){var p=D.pos.find(function(x){return x.id===id});return p?p.description:''}
function posIco(id){var p=D.pos.find(function(x){return x.id===id});return p?p.icon:''}
function viewP(p,mode){var F=mode==='full'?ALL:fieldsOf(p),code=S.idOf(p);
 modal('<div style="display:flex;gap:10px;margin:0 46px 18px 0;flex-wrap:wrap"><button class="btn sm'+(mode==='public'?' pri':'')+'" id="v1">Vue publique</button><button class="btn sm'+(mode==='full'?' pri':'')+'" id="v2">Vue complète (admin)</button><button class="btn sm'+(mode==='badge'?' pri':'')+'" id="v3">'+S.ic('badge')+'Badge</button></div><div id="vp"></div>');
 var el=document.getElementById('vp'),v=S.view(p,posOf(p.position_id),mode==='badge'?fieldsOf(p):F,posDesc(p.position_id),posIco(p.position_id));
 if(mode==='badge'){el.innerHTML='<div class="bdg-host">'+S.badgeCard(v,{code:code})+'</div><p class="bdg-note">Badge tel que le public le voit (règles de la catégorie). Lien : '+esc(S.badgeUrl(code))+'</p>';S.bindBadge(el,{code:code,name:p.full_name})}
 else{el.innerHTML=S.renderProfile(v,{code:code,noActs:true});S.bindProfile(el,code,p.full_name)}
 document.getElementById('v1').onclick=function(){viewP(p,'public')};document.getElementById('v2').onclick=function(){viewP(p,'full')};document.getElementById('v3').onclick=function(){viewP(p,'badge')}}
function editP(p){modal('<h3 style="margin:0 46px 16px 0">Modifier — '+esc(p.full_name)+'</h3><div id="ed"></div>');
 S.editor(document.getElementById('ed'),p,{admin:true,positions:D.pos,categories:D.cats,fields:fieldsOf(p),onSaved:function(){closeM();refresh()}})}
async function refresh(){await load();draw()}

/* ---- invitations ---- */
function genCode(){var a='ABCDEFGHJKMNPQRSTUVWXYZ23456789',b=new Uint8Array(6);crypto.getRandomValues(b);return'WYK-'+[].map.call(b,function(x){return a[x%a.length]}).join('')}
function invites(){
 shell('<section class="nm card" style="margin-bottom:22px"><h3>'+S.ic('plus')+'Nouvelle invitation</h3><form id="nf"><div class="row"><div class="field"><label>Code</label><div style="display:flex;gap:8px"><input id="ic" value="'+genCode()+'" style="text-transform:uppercase;font-weight:600;letter-spacing:.06em" required><button type="button" class="btn sm" id="ig">Générer</button></div></div><div class="field"><label>Poste</label><select id="ip" required><option value="">— Choisir —</option>'+D.pos.map(function(p){return'<option value="'+p.id+'">'+esc(p.title)+'</option>'}).join('')+'</select></div><div class="field"><label>Catégorie</label><select id="icat"><option value="">Par défaut</option>'+D.cats.filter(function(c){return!c.is_default}).map(function(c){return'<option value="'+c.id+'">'+esc(c.name)+'</option>'}).join('')+'</select></div><div class="field"><label>Expire le (facultatif)</label><input type="date" id="ix"></div></div><div class="field"><label>Note interne (facultatif)</label><input id="in" placeholder="Pour qui est ce code ?"></div><button class="btn pri">'+S.ic('check')+'Créer l\'invitation</button></form></section><div class="list" id="il"></div>');
 document.getElementById('ig').onclick=function(){document.getElementById('ic').value=genCode()};
 document.getElementById('nf').onsubmit=async function(e){e.preventDefault();var x=document.getElementById('ix').value;
  var r=await db.from('staff_invites').insert({code:document.getElementById('ic').value.trim().toUpperCase(),position_id:document.getElementById('ip').value||null,category_id:document.getElementById('icat').value||null,note:document.getElementById('in').value||null,expires_at:x?new Date(x+'T23:59:59').toISOString():null,created_by:S.user.id});
  if(r.error)return S.toast(/duplicate/.test(r.error.message)?'Ce code existe déjà.':r.error.message,1);S.toast('Invitation créée');refresh()};
 var link=function(c){return location.origin+'/activer?code='+encodeURIComponent(c)};
 document.getElementById('il').innerHTML=D.inv.length?D.inv.map(function(i){return'<div class="nm li" data-id="'+i.id+'"><div class="info"><b style="letter-spacing:.06em">'+esc(i.code)+'</b><span class="small mut">'+esc(posOf(i.position_id))+' · '+esc(catOf(i.category_id))+(i.note?' · '+esc(i.note):'')+'</span><br><span class="small mut">Créée le '+esc(S.date(i.created_at,'full'))+(i.expires_at?' · expire le '+esc(S.date(i.expires_at,'full')):'')+'</span></div><span class="pill '+i.status+'">'+({pending:'En attente',used:'Utilisé',revoked:'Annulé'})[i.status]+'</span><div class="act">'+(i.status==='pending'?'<button class="btn sm" data-a="lk">'+S.ic('link')+'Copier le lien</button><button class="btn sm" data-a="cd">Copier le code</button><button class="btn sm dng" data-a="rv">Annuler</button>':'')+'<button class="btn sm dng" data-a="dl" aria-label="Supprimer">'+S.ic('trash')+'</button></div></div>'}).join(''):'<div class="empty">Aucune invitation.</div>';
 document.getElementById('il').onclick=async function(e){var b=e.target.closest('button[data-a]');if(!b)return;var id=b.closest('.li').dataset.id,i=D.inv.find(function(x){return x.id===id});
  if(b.dataset.a==='lk')return S.copy(link(i.code),'Lien d\'invitation copié');if(b.dataset.a==='cd')return S.copy(i.code,'Code copié');
  var r=b.dataset.a==='rv'?await db.from('staff_invites').update({status:'revoked'}).eq('id',id):(confirm('Supprimer cette invitation ?')?await db.from('staff_invites').delete().eq('id',id):null);
  if(r){if(r.error)return S.toast(r.error.message,1);refresh()}}}

/* ---- catégories & visibilité ---- */
var selCat=null;
function cats(){if(!D.cats.find(function(c){return c.id===selCat}))selCat=(D.cats[0]||{}).id;var c=D.cats.find(function(x){return x.id===selCat});
 shell('<div class="grid2" style="grid-template-columns:260px 1fr;align-items:start"><section class="nm card"><h3>'+S.ic('tag')+'Catégories</h3><div class="list" id="cl">'+D.cats.map(function(x){return'<button class="nm-s li" data-c="'+x.id+'" style="'+(x.id===selCat?'box-shadow:var(--in);color:var(--red)':'')+';justify-content:space-between;text-align:left"><span><b style="font-size:15px">'+esc(x.name)+'</b></span><span class="small mut">'+D.profs.filter(function(p){return x.is_default?!p.category_id:p.category_id===x.id}).length+'</span></button>'}).join('')+'</div><button class="btn sm" id="nc" style="margin-top:14px">'+S.ic('plus')+'Nouvelle catégorie</button></section>'+
 '<section class="nm card" id="ce"></section></div>');
 var ce=document.getElementById('ce');
 if(c)ce.innerHTML='<h3>'+S.ic('eye')+'Visible publiquement — '+esc(c.name)+'</h3><p class="small mut" style="margin-bottom:14px">'+(c.is_default?'Cette catégorie s\'applique aux profils sans catégorie.':'Cochez ce que le public peut voir pour les profils de cette catégorie.')+' Le nom, le poste et le statut sont toujours visibles. « Âge » et « Date de naissance exacte » sont indépendants : vous pouvez montrer l\'âge seul.</p><div class="fgrid">'+S.FIELDS.map(function(f){return'<label class="fchk"><input type="checkbox" value="'+f[0]+'"'+(c.public_fields.indexOf(f[0])>-1?' checked':'')+'>'+f[1]+'</label>'}).join('')+'</div>'+(c.is_default?'':'<div class="field" style="margin-top:18px"><label>Nom de la catégorie</label><input id="cn" value="'+esc(c.name)+'"></div>')+'<div style="display:flex;gap:10px;flex-wrap:wrap;margin-top:18px"><button class="btn pri" id="cs">'+S.ic('check')+'Enregistrer</button><button class="btn" id="ca">Appliquer à toutes les catégories</button>'+(c.is_default?'':'<button class="btn dng" id="cd">'+S.ic('trash')+'Supprimer</button>')+'</div>';
 var sel=function(){return[].map.call(ce.querySelectorAll('input[type=checkbox]:checked'),function(i){return i.value})};
 document.getElementById('cl').onclick=function(e){var b=e.target.closest('[data-c]');if(b){selCat=b.dataset.c;cats()}};
 document.getElementById('nc').onclick=async function(){var n=prompt('Nom de la nouvelle catégorie (ex : Livraison)');if(!n)return;var d=D.cats.find(function(x){return x.is_default});var r=await db.from('staff_categories').insert({name:n.trim(),public_fields:d?d.public_fields:[],sort:D.cats.length}).select().single();if(r.error)return S.toast(r.error.message,1);selCat=r.data.id;refresh()};
 if(!c)return;
 document.getElementById('cs').onclick=async function(){var u={public_fields:sel()},n=document.getElementById('cn');if(n){if(!n.value.trim())return S.toast('Nom requis',1);u.name=n.value.trim()}var r=await db.from('staff_categories').update(u).eq('id',c.id);if(r.error)return S.toast(r.error.message,1);S.toast('Règles enregistrées');refresh()};
 document.getElementById('ca').onclick=async function(){if(!confirm('Copier ces règles sur toutes les catégories ?'))return;var r=await db.from('staff_categories').update({public_fields:sel()}).neq('id','00000000-0000-0000-0000-000000000000');if(r.error)return S.toast(r.error.message,1);S.toast('Règles appliquées partout');refresh()};
 var cd=document.getElementById('cd');if(cd)cd.onclick=async function(){if(!confirm('Supprimer « '+c.name+' » ? Ses profils passeront en catégorie par défaut.'))return;var r=await db.from('staff_categories').delete().eq('id',c.id);if(r.error)return S.toast(r.error.message,1);selCat=null;refresh()}}

/* ---- postes ---- */
function pos(){
 shell('<section class="nm card" style="margin-bottom:22px"><h3>'+S.ic('plus')+'Nouveau poste</h3><form id="pn"><div class="row"><div class="field"><label>Intitulé</label><input id="pt" placeholder="Livreur" required></div><div class="field"><label>Code (3 lettres, pour l\'ID)</label><input id="pc" maxlength="4" placeholder="LIV" style="text-transform:uppercase" required></div></div><div class="field"><label>Description du poste (affichée sur le badge)</label><textarea id="pd" style="min-height:70px" maxlength="220" placeholder="Ex : Livraison des commandes WYK, rapidité et service irréprochable."></textarea></div><div class="field"><label>Icône du badge</label>'+S.iconPicker('','np')+'</div><button class="btn pri">'+S.ic('plus')+'Ajouter</button></form></section><div class="list" id="pl"></div>');
 document.getElementById('pl').innerHTML=D.pos.length?D.pos.map(function(p){return'<div class="nm li" data-id="'+p.id+'"><div class="field" style="margin:0;flex:2;min-width:180px"><input data-f="title" value="'+esc(p.title)+'"></div><div class="field" style="margin:0;width:110px"><input data-f="code" value="'+esc(p.code)+'" maxlength="4" style="text-transform:uppercase"></div><div class="field" style="margin:0;flex:1 1 100%"><textarea data-f="description" maxlength="220" style="min-height:62px" placeholder="Description du poste (badge)">'+esc(p.description||'')+'</textarea></div><div class="field" style="margin:0;flex:1 1 100%"><label>Icône du badge</label>'+S.iconPicker(p.icon||'')+'</div><span class="small mut">'+D.profs.filter(function(x){return x.position_id===p.id}).length+' profil(s)</span><div class="act"><button class="btn sm" data-a="sv">'+S.ic('check')+'Enregistrer</button><button class="btn sm dng" data-a="dl" aria-label="Supprimer">'+S.ic('trash')+'</button></div></div>'}).join(''):'<div class="empty">Aucun poste.</div>';
 document.getElementById('pn').onsubmit=async function(e){e.preventDefault();var r=await db.from('staff_positions').insert({title:document.getElementById('pt').value.trim(),code:document.getElementById('pc').value.trim().toUpperCase(),description:document.getElementById('pd').value.trim()||null,icon:document.getElementById('pn').querySelector('[data-f=icon]').value||null,sort:D.pos.length+1});if(r.error)return S.toast(r.error.message,1);S.toast('Poste ajouté');refresh()};
 S.bindIconPickers(document.getElementById('pn'));S.bindIconPickers(document.getElementById('pl'));
 document.getElementById('pl').onclick=async function(e){var b=e.target.closest('button[data-a]');if(!b)return;var li=b.closest('.li'),id=li.dataset.id,r;
  if(b.dataset.a==='sv')r=await db.from('staff_positions').update({title:li.querySelector('[data-f=title]').value.trim(),code:li.querySelector('[data-f=code]').value.trim().toUpperCase(),description:li.querySelector('[data-f=description]').value.trim()||null,icon:li.querySelector('[data-f=icon]').value||null}).eq('id',id);
  else{if(!confirm('Supprimer ce poste ? Les profils concernés n\'auront plus de poste affiché.'))return;r=await db.from('staff_positions').delete().eq('id',id)}
  if(r.error)return S.toast(r.error.message,1);S.toast('Fait');refresh()}}

await load();draw();
})();
</script>
</body></html>
